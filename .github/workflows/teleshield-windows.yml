name: TeleShield Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: teleshield-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PREPARE_PATH: Telegram/build/prepare/prepare.py

    defaults:
      run:
        shell: cmd

    steps:
      - name: Clean up preinstalled software
        shell: pwsh
        run: |
          $before = (Get-PSDrive C).Free / 1GB
          Get-Service docker -ErrorAction SilentlyContinue | Stop-Service -ErrorAction SilentlyContinue
          wsl --shutdown 2> $null
          Remove-Item "C:\Android\android-sdk", "C:\Program Files\dotnet", "C:\Miniconda", "C:\msys64", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", "$env:LOCALAPPDATA\Docker", "C:\ProgramData\DockerDesktop", "C:\Program Files\PostgreSQL", "C:\PostgreSQL", "C:\Program Files\MongoDB", "C:\Program Files\MySQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\ghcup", "C:\cabal", "C:\Program Files\LLVM", "C:\vcpkg", "C:\tools\kotlinc", "C:\tools\php", "C:\tools\Apache24", "C:\tools\nginx-*", "C:\selenium", "C:\SeleniumWebDrivers", "C:\Program Files\R", "C:\Program Files (x86)\R", "C:\rtools*", "C:\Program Files\Google\Chrome*", "C:\Program Files (x86)\Google\Chrome*", "C:\Program Files\Mozilla Firefox*", "C:\ProgramData\Package Cache" -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem "C:\ProgramData\Microsoft\VisualStudio\Packages" -Exclude _Instances -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item C:\hostedtoolcache\windows\Go*, C:\hostedtoolcache\windows\Ruby*, C:\hostedtoolcache\windows\PyPy*, C:\hostedtoolcache\windows\Java_*, C:\hostedtoolcache\windows\NuGet* -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host ('{0:N1} GB -> {1:N1} GB free' -f $before, ((Get-PSDrive C).Free / 1GB))

      - name: Configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "C:"

      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Read SDK and cache key
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - name: Validate Telegram API secrets
        shell: pwsh
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TDESKTOP_API_ID)) { throw 'TDESKTOP_API_ID secret is required.' }
          if ([string]::IsNullOrWhiteSpace($env:TDESKTOP_API_HASH)) { throw 'TDESKTOP_API_HASH secret is required.' }

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: "14.44"

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache
        uses: actions/cache/restore@v4
        id: cache-third-party
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Restore Libraries cache
        uses: actions/cache/restore@v4
        id: cache-libs
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.OS }}-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-

      - name: Prepare Windows libraries
        id: prepare-libs
        env:
          SKIP_DUMPSYMS: "1"
        run: |
          set CARGO_INCREMENTAL=0
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Free up disk space
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/src/wallet_engine/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save ThirdParty cache
        uses: actions/cache/save@v4
        if: always() && steps.prepare-libs.outcome == 'success' && steps.cache-third-party.outputs.cache-hit != 'true'
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Save Libraries cache
        uses: actions/cache/save@v4
        if: always() && steps.prepare-libs.outcome == 'success' && steps.cache-libs.outputs.cache-hit != 'true'
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.OS }}-x64-libs-${{ env.CACHE_KEY }}

      - name: Stub private packer keys
        shell: bash
        run: |
          mkdir -p "$TBUILD/DesktopPrivate"
          cat > "$TBUILD/DesktopPrivate/packer_private.h" <<'EOF'
          const char *PrivateKey = "";
          const char *PrivateBetaKey = "";
          EOF
          cat > "$TBUILD/DesktopPrivate/alpha_private.h" <<'EOF'
          #pragma once
          static const char *AlphaPrivateKey = "";
          EOF

      - name: Configure Telegram Desktop
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat ^
          x64 ^
          -DTDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} ^
          -DTDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }} ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_ENABLE_LTO=OFF ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

      - name: Build Telegram Desktop
        env:
          _CL_: "/Zm250"
          CXXFLAGS: "/MP2 /Zm250"
        run: cmake --build %TBUILD%\%REPO_NAME%\out --config Release --target Telegram --parallel 2 -- /m:2 /p:CL_MPCount=2

      - name: Package TeleShield
        shell: pwsh
        run: |
          $repo = Join-Path $env:TBUILD $env:REPO_NAME
          $telegram = Join-Path $repo 'out\Release\Telegram.exe'
          $core = Join-Path $repo 'Telegram\SourceFiles\teleshield\sdk\teleshield_core.dll'
          if (-not (Test-Path -LiteralPath $telegram)) { throw "Missing build output: $telegram" }
          if (-not (Test-Path -LiteralPath $core)) { throw "Missing native core: $core" }
          $package = Join-Path $env:GITHUB_WORKSPACE 'TeleShield-Windows-x64'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item -LiteralPath $telegram -Destination (Join-Path $package 'TeleShield.exe')
          Copy-Item -LiteralPath $core -Destination (Join-Path $package 'teleshield_core.dll')
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'TeleShield-Windows-x64.zip') -Force

      - name: Upload TeleShield artifact
        uses: actions/upload-artifact@v7
        with:
          name: TeleShield-Windows-x64
          path: TeleShield-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
